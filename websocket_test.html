<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Chat Interface</title>
    <style>
        :root {
            /* Pink Theme Variables */
            --theme-primary: #ff69b4;
            --theme-secondary: #ff1493;
            --theme-background: #fff0f5;
            --text-primary: #333;
            --input-background: #ffffff;

            /* Purple Theme Variables */
            --purple-primary: #8a4fff;
            --purple-secondary: #6a1b9a;
            --purple-background: #f3e5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff69b4 0%, #8a4fff 100%);
            perspective: 1000px;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: rotateX(10deg) scale(0.9);
            transition: all 0.3s ease;
        }

        .chat-container:hover {
            transform: rotateX(0) scale(1);
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
        }

        .chat-header {
            background: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary));
            color: white;
            padding: 15px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: rgba(255,255,255,0.9);
            background-image: 
                linear-gradient(rgba(255,105,180,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,105,180,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 15px;
            font-size: 14px;
            position: relative;
            clear: both;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
            color: white;
            margin-left: auto;
        }

        .bot-message {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        #messageInput {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--theme-primary);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        #sendButton {
            margin-left: 10px;
            padding: 10px 15px;
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #sendButton:hover {
            transform: scale(1.05);
        }

        /* Purple Theme */
        body.purple-theme {
            background: linear-gradient(135deg, #6a1b9a 0%, #8a4fff 100%);
        }

        .purple-theme .chat-container {
            background: rgba(255,255,255,0.95);
        }

        .purple-theme .chat-header {
            background: linear-gradient(90deg, var(--purple-primary), var(--purple-secondary));
        }

        .purple-theme .chat-box {
            background-image: 
                linear-gradient(rgba(138,79,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138,79,255,0.05) 1px, transparent 1px);
        }

        .purple-theme #messageInput {
            border-color: var(--purple-primary);
        }

        .purple-theme #sendButton {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-secondary));
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Professional Chat Assistant
            <button class="theme-toggle">Switch Theme</button>
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const socket = new WebSocket('ws://127.0.0.1:8000/ws/chat');
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        let currentTheme = 'pink';

        themeToggle.addEventListener('click', () => {
            if (currentTheme === 'pink') {
                body.classList.add('purple-theme');
                currentTheme = 'purple';
            } else {
                body.classList.remove('purple-theme');
                currentTheme = 'pink';
            }
        });

        socket.onopen = function() {
            console.log('WebSocket connected');
        };

        socket.onmessage = function(event) {
            const chatBox = document.getElementById('chatBox');

            // Remove typing indicator
            const typingIndicator = document.querySelector('.typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }

            // Create bot message
            const message = document.createElement('div');
            message.className = 'message bot-message';
            message.innerHTML = event.data;
            chatBox.appendChild(message);
            
            // Auto-scroll
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        document.getElementById('sendButton').onclick = function() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            if (!messageText) return;

            const chatBox = document.getElementById('chatBox');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user-message';
            userMessage.innerHTML = messageText;
            chatBox.appendChild(userMessage);
            socket.send(messageText);
            messageInput.value = ''; // Clear input

            // Typing indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = 'Assistant is typing...';
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        socket.onclose = function() {
            console.log('WebSocket disconnected');
        };
    </script>
</body>
</html>
